name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Formato · Tipos · Unit · Build
    runs-on: ubuntu-24.04
    env:
      # Valores ficticios: el build valida el esquema de entorno, no se conecta a nada.
      APP_ENV: test
      WORKER_DATABASE_URL: postgres://system_worker:ci@localhost:5432/ci
      CRON_SECRET: ci-cron-secret-0000000000000000000000
      JOBS_HMAC_SECRET: ci-hmac-secret-0000000000000000000000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-key-000000
      GATEWAY_DATABASE_URL: postgres://storefront_gateway:ci@localhost:5432/ci
      APP_HOSTNAME: localhost:3000
      PREVIEW_HMAC_SECRET: ci-preview-secret-00000000000000000000
      ORDER_LINK_SECRET: ci-order-link-secret-000000000000000000
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: fake
      EMAIL_FROM: Plataforma <no-reply@ci.test>
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migraciones · pgTAP · Integración
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL + pgTAP (el mismo motor que la verificación local)
        run: |
          PG_MAJOR=$(ls /usr/lib/postgresql | sort -n | tail -1)
          echo "PostgreSQL ${PG_MAJOR}"
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-${PG_MAJOR}-pgtap" libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres';"
      - run: pnpm db:test
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  stack:
    name: Stack local · Auth y Storage reales + PostgREST + RLS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL + pgTAP
        run: |
          PG_MAJOR=$(ls /usr/lib/postgresql | sort -n | tail -1)
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-${PG_MAJOR}-pgtap"
          sudo systemctl start postgresql.service
          sudo -u postgres psql -q -c "alter user postgres password 'postgres';"
      - name: Levantar stack (binarios fijados con sha256; Storage compilado desde un commit fijado)
        run: bash scripts/dev/stack.sh up
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Compilar y arrancar la app contra el stack
        run: |
          eval "$(bash scripts/dev/stack.sh env | sed 's/^/export /')"
          export APP_ENV=test WORKER_DATABASE_URL=postgres://system_worker:system_worker_dev_password@localhost:5432/pruva_dev
          export GATEWAY_DATABASE_URL=postgres://storefront_gateway:storefront_gateway_dev_password@localhost:5432/pruva_dev
          export CRON_SECRET=ci-cron-secret-0000000000000000000000 JOBS_HMAC_SECRET=ci-hmac-secret-0000000000000000000000
          export APP_HOSTNAME=localhost:3000 PREVIEW_HMAC_SECRET=ci-preview-secret-00000000000000000000
          export ORDER_LINK_SECRET=ci-order-link-secret-000000000000000000
          # Stripe Billing contra el Stripe simulado de tests/e2e/billing-card.spec.ts (sin red real).
          export STRIPE_SECRET_KEY=sk_test_0000000000 STRIPE_BILLING_WEBHOOK_SECRET=whsec_0000000000 STRIPE_API_BASE=http://127.0.0.1:4599
          export APP_URL=http://localhost:3000 EMAIL_PROVIDER=mailpit "EMAIL_FROM=Plataforma <no-reply@ci.test>"
          env | grep -E '^(APP_|WORKER_|GATEWAY_|CRON_|JOBS_|PREVIEW_|ORDER_LINK_|EMAIL_|NEXT_PUBLIC_|SUPABASE_SERVICE_ROLE_KEY|STRIPE_)' >> "$GITHUB_ENV"
          pnpm build
          nohup pnpm start -H localhost -p 3000 > .stack/run/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/api/health && break; sleep 1; done
      - run: pnpm test:stack
      - name: E2E (Playwright, Chromium del runner)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - name: Logs del stack
        if: failure()
        run: tail -n 100 .stack/run/*.log

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
